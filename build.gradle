plugins {
    id 'fabric-loom' version '1.8.4'
    id 'maven-publish'
}
version = '1.0.7-BETA'
group = 'io.github.lavacore'
base { archivesName = 'lava-core' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modCompileOnly 'net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4'

    // Paper/Adventure via Fabric Jar-in-Jar (Loom include). NEVER shade ASM — Fabric Loader owns it.
    modImplementation include('io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT')
    include 'net.kyori:adventure-api:4.17.0'
    include 'net.kyori:adventure-key:4.17.0'
    include 'net.kyori:adventure-text-minimessage:4.17.0'
    include 'net.kyori:adventure-text-serializer-gson:4.17.0'
    include 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    include 'net.kyori:adventure-text-serializer-plain:4.17.0'
    include 'net.kyori:adventure-text-logger-slf4j:4.17.0'
    include 'net.kyori:adventure-text-serializer-json:4.17.0'
    include 'net.kyori:adventure-nbt:4.17.0'
    include 'net.kyori:examination-api:1.3.0'
    include 'net.kyori:examination-string:1.3.0'
    include 'net.kyori:option:1.0.0'
    include 'net.md-5:bungeecord-chat:1.20-R0.2'
    include 'org.yaml:snakeyaml:2.2'
    include 'com.googlecode.json-simple:json-simple:1.1.1'
    include 'org.slf4j:slf4j-api:2.0.9'
    // ASM: compileOnly only — do not include/shade (causes LinkageError with Knot)
    compileOnly 'org.ow2.asm:asm:9.7'
    compileOnly 'org.ow2.asm:asm-commons:9.7'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
